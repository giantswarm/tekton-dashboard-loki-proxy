version: 2.1

orbs:
  architect: giantswarm/architect@10.17.4

workflows:
  build:
    jobs:
      - architect/go-test:
          name: go-test
          context: architect
          filters:
            tags:
              only: /^v.*/

      - architect/push-to-registries:
          name: push-to-registries
          context: architect
          requires:
            - go-test
          filters:
            branches:
              ignore:
                - main
                - master
            tags:
              only: /^v.*/

      - architect/push-to-app-catalog:
          name: push-to-giantswarm-catalog
          context: architect
          executor: app-build-suite
          chart: tekton-dashboard-loki-proxy
          app_catalog: giantswarm-catalog
          app_catalog_test: giantswarm-test-catalog
          requires:
            - push-to-registries
          filters:
            branches:
              ignore:
                - main
                - master
            tags:
              only: /^v.*/
